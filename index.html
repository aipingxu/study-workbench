<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="英语学习台">
<meta name="theme-color" content="#0F766E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
--pri:#0F766E;--pri-l:#CCFBF1;--pri-d:#134E4A;
--acc:#F59E0B;--acc-l:#FEF3C7;--acc-d:#92400E;
--slate:#475569;--slate-l:#F1F5F9;--slate-d:#1E293B;
--red:#EF4444;--grn:#22C55E;--bg:#F8FAFC;--card:#fff;
--rd:12px;--sh:0 1px 3px rgba(0,0,0,.08);--sh2:0 4px 12px rgba(0,0,0,.1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--slate-d);line-height:1.6;max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:70px}
h1,h2,h3{font-weight:700;line-height:1.3}
.muted{color:var(--slate);font-size:13px}
.hidden{display:none!important}
/* Tab Bar */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid rgba(0,0,0,.06);display:flex;justify-content:space-around;align-items:center;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:100}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--slate);cursor:pointer;transition:.2s;padding:4px 12px;border-radius:8px}
.tab.active{color:var(--pri)}
.tab-ic{font-size:20px}
/* Pages */
.page{display:none;padding:16px;animation:fade .3s}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* Header */
.hdr{background:linear-gradient(135deg,var(--pri),var(--pri-d));color:#fff;padding:20px 16px;border-radius:var(--rd);margin-bottom:16px;position:relative;overflow:hidden}
.hdr::after{content:'';position:absolute;top:-20px;right:-20px;width:100px;height:100px;background:rgba(255,255,255,.08);border-radius:50%}
.hdr h1{font-size:20px;margin-bottom:4px}
.hdr p{font-size:13px;opacity:.85}
.streak-badge{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.2);padding:4px 12px;border-radius:20px;font-size:13px;font-weight:600}
/* Cards */
.card{background:var(--card);border-radius:var(--rd);box-shadow:var(--sh);padding:16px;margin-bottom:12px}
.card-tap{cursor:pointer;transition:.2s}
.card-tap:active{transform:scale(.98)}
.sec-title{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sec-title .dot{width:4px;height:16px;background:var(--pri);border-radius:2px}
/* Progress bar */
.pbar{height:6px;background:var(--slate-l);border-radius:3px;overflow:hidden;margin-top:8px}
.pbar-fill{height:100%;background:linear-gradient(90deg,var(--pri),var(--acc));border-radius:3px;transition:.5s}
/* Timer card */
.timer-card{background:linear-gradient(135deg,var(--pri),var(--pri-d));color:#fff;text-align:center;padding:24px 16px}
.timer-display{font-size:48px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:2px;margin:8px 0}
.timer-label{font-size:14px;opacity:.85}
.timer-btns{display:flex;gap:12px;justify-content:center;margin-top:16px}
.timer-btn{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3);color:#fff;padding:8px 20px;border-radius:20px;font-size:14px;font-weight:600;cursor:pointer;transition:.2s}
.timer-btn:active{background:rgba(255,255,255,.3)}
.timer-btn.active{background:var(--acc);border-color:var(--acc)}
/* Lesson item */
.lesson-item{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card);border-radius:var(--rd);box-shadow:var(--sh);margin-bottom:8px;cursor:pointer;transition:.2s}
.lesson-item:active{transform:scale(.98)}
.lesson-item.locked{opacity:.5;cursor:not-allowed}
.lesson-item.done{border-left:3px solid var(--grn)}
.lesson-num{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0;background:var(--pri-l);color:var(--pri)}
.lesson-item.done .lesson-num{background:var(--grn);color:#fff}
.lesson-item.locked .lesson-num{background:var(--slate-l);color:var(--slate)}
.lesson-info{flex:1;min-width:0}
.lesson-info .t{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lesson-info .d{font-size:12px;color:var(--slate)}
.lesson-status{font-size:18px}
/* Phrase card */
.phrase-card{background:var(--card);border-radius:var(--rd);box-shadow:var(--sh);padding:16px;margin-bottom:10px;border-left:3px solid var(--pri)}
.phrase-en{font-size:17px;font-weight:700;color:var(--slate-d);margin-bottom:4px}
.phrase-cn{font-size:14px;color:var(--slate)}
.phrase-actions{display:flex;gap:8px;margin-top:10px}
.mini-btn{padding:6px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:.2s}
.mini-btn.speak{background:var(--pri-l);color:var(--pri)}
.mini-btn.speak:active{background:var(--pri);color:#fff}
.mini-btn.video{background:var(--acc-l);color:var(--acc-d)}
.mini-btn.video:active{opacity:.7}
/* Flashcard */
.flashcard-container{perspective:1000px;margin:0 auto 20px}
.flashcard{width:100%;max-width:400px;height:240px;position:relative;transition:transform .6s;transform-style:preserve-3d;cursor:pointer;margin:0 auto}
.flashcard.flipped{transform:rotateY(180deg)}
.flashcard-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;box-shadow:var(--sh2)}
.flashcard-front{background:linear-gradient(135deg,var(--pri),var(--pri-d));color:#fff}
.flashcard-back{background:#fff;border:2px solid var(--pri-l);transform:rotateY(180deg)}
.flashcard-word{font-size:28px;font-weight:800;text-align:center}
.flashcard-phonetic{font-size:14px;opacity:.8;margin-top:8px}
.flashcard-meaning{font-size:18px;font-weight:700;color:var(--slate-d);text-align:center}
.flashcard-example{font-size:13px;color:var(--slate);margin-top:12px;text-align:center;font-style:italic}
.flashcard-hint{font-size:11px;opacity:.6;margin-top:auto;position:absolute;bottom:12px}
/* Vocab list */
.vocab-item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);border-radius:var(--rd);box-shadow:var(--sh);margin-bottom:8px}
.vocab-word{font-size:15px;font-weight:700;flex:1}
.vocab-word .ph{font-size:12px;color:var(--slate);font-weight:400;margin-left:6px}
.vocab-meaning{font-size:13px;color:var(--slate)}
.vocab-status{font-size:18px}
/* Buttons */
.btn{display:block;width:100%;padding:14px;border-radius:var(--rd);font-size:15px;font-weight:700;text-align:center;cursor:pointer;border:none;transition:.2s}
.btn-primary{background:var(--pri);color:#fff}
.btn-primary:active{background:var(--pri-d)}
.btn-amber{background:var(--acc);color:#fff}
.btn-amber:active{opacity:.85}
.btn-outline{background:transparent;border:2px solid var(--pri);color:var(--pri)}
.btn-grn{background:var(--grn);color:#fff}
.btn-red{background:var(--red);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* Checkin */
.checkin-box{text-align:center;padding:30px 16px}
.checkin-circle{width:80px;height:80px;border-radius:50%;background:var(--grn);color:#fff;display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 16px;animation:pop .4s}
@keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.1)}100%{transform:scale(1)}}
/* Stats */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.stat-box{background:var(--card);border-radius:var(--rd);box-shadow:var(--sh);padding:16px;text-align:center}
.stat-num{font-size:28px;font-weight:800;color:var(--pri)}
.stat-label{font-size:12px;color:var(--slate);margin-top:4px}
.chart-wrap{background:var(--card);border-radius:var(--rd);box-shadow:var(--sh);padding:16px;margin-bottom:12px}
.chart-wrap h3{font-size:14px;margin-bottom:12px}
/* Menu */
.menu-item{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card);border-radius:var(--rd);box-shadow:var(--sh);margin-bottom:8px;cursor:pointer;transition:.2s}
.menu-item:active{background:var(--slate-l)}
.menu-icon{font-size:20px;width:28px;text-align:center}
.menu-text{flex:1;font-size:14px;font-weight:600}
.menu-arrow{color:var(--slate);font-size:18px}
/* Modal */
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal-overlay.show{display:flex;animation:fade .2s}
.modal{background:#fff;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:85vh;overflow-y:auto;animation:slideup .3s}
@keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
.modal-title{font-size:18px;font-weight:700;margin-bottom:16px;text-align:center}
.modal-close{position:absolute;top:12px;right:16px;font-size:22px;color:var(--slate);cursor:pointer}
/* Toast */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--slate-d);color:#fff;padding:10px 24px;border-radius:20px;font-size:14px;z-index:300;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1;bottom:100px}
/* Confetti */
.confetti{position:fixed;width:10px;height:10px;z-index:250;pointer-events:none;animation:fall 3s ease-in forwards}
@keyframes fall{to{transform:translateY(100vh) rotate(720deg);opacity:0}}
/* Week selector */
.week-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.week-tab{flex-shrink:0;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;background:var(--slate-l);color:var(--slate);cursor:pointer;transition:.2s;white-space:nowrap}
.week-tab.active{background:var(--pri);color:#fff}
.week-tab.locked{opacity:.5}
/* Phase tag */
.phase-tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;margin-bottom:8px}
.phase-1{background:#DBEAFE;color:#1E40AF}
.phase-2{background:var(--acc-l);color:var(--acc-d)}
.phase-3{background:#E0E7FF;color:#3730A3}
/* Responsive desktop */
@media(min-width:600px){
body{box-shadow:0 0 20px rgba(0,0,0,.05);min-height:100vh}
}
</style>
</head>
<body>
<!-- Today Page -->
<div class="page active" id="page-today">
<div class="hdr" id="todayHeader">
<div class="streak-badge" id="streakBadge">🔥 0天</div>
<h1>今日学习</h1>
<p id="todayDate">加载中...</p>
</div>
<div id="checkinArea"></div>
<div class="card" id="todaySpeaking">
<div class="sec-title"><span class="dot"></span>🎤 口语任务 · 20分钟</div>
<div id="todaySpeakingContent"></div>
</div>
<div class="card" id="todayVocab">
<div class="sec-title"><span class="dot" style="background:var(--acc)"></span>📚 词汇任务 · 15分钟</div>
<div id="todayVocabContent"></div>
</div>
<div class="card">
<div class="sec-title"><span class="dot" style="background:var(--grn)"></span>📊 今日进度</div>
<div id="todayProgress"></div>
</div>
</div>

<!-- Speaking Page -->
<div class="page" id="page-speaking">
<div class="hdr">
<h1>口语训练</h1>
<p>每天20分钟 · 循序渐进 · 从零开始</p>
</div>
<div class="week-tabs" id="speakingWeekTabs"></div>
<div id="speakingLessons"></div>
</div>

<!-- Vocab Page -->
<div class="page" id="page-vocab">
<div class="hdr" style="background:linear-gradient(135deg,var(--acc),var(--acc-d))">
<h1>词汇积累</h1>
<p>每天15分钟 · 闪卡记忆 · 间隔复习</p>
</div>
<div class="week-tabs" id="vocabWeekTabs"></div>
<div id="vocabLessons"></div>
</div>

<!-- Stats Page -->
<div class="page" id="page-stats">
<div class="hdr" style="background:linear-gradient(135deg,var(--slate-d),var(--slate))">
<h1>学习统计</h1>
<p>坚持就是胜利 💪</p>
</div>
<div class="stat-grid">
<div class="stat-box"><div class="stat-num" id="statDays">0</div><div class="stat-label">累计打卡天数</div></div>
<div class="stat-box"><div class="stat-num" id="statLessons">0</div><div class="stat-label">完成课程数</div></div>
<div class="stat-box"><div class="stat-num" id="statWords">0</div><div class="stat-label">掌握单词数</div></div>
<div class="stat-box"><div class="stat-num" id="statMinutes">0</div><div class="stat-label">学习总时长(分)</div></div>
</div>
<div class="chart-wrap"><h3>📅 近7天打卡</h3><canvas id="chart7days" height="80"></canvas></div>
<div class="chart-wrap"><h3>📊 口语vs词汇进度</h3><canvas id="chartProgress" height="120"></canvas></div>
<div class="chart-wrap"><h3>🎯 学习方式分布</h3><canvas id="chartType" height="120"></canvas></div>
</div>

<!-- My Page -->
<div class="page" id="page-my">
<div class="hdr" style="background:linear-gradient(135deg,#6366F1,#4F46E5)">
<h1>我的</h1>
<p>商务英语 × 临床系统英语</p>
</div>
<div class="card">
<div class="sec-title"><span class="dot"></span>学习目标</div>
<div id="goalDisplay"></div>
</div>
<div class="menu-item" onclick="exportData()"><span class="menu-icon">📥</span><span class="menu-text">导出数据</span><span class="menu-arrow">›</span></div>
<div class="menu-item" onclick="document.getElementById('importFile').click()"><span class="menu-icon">📤</span><span class="menu-text">导入数据</span><span class="menu-arrow">›</span></div>
<input type="file" id="importFile" accept=".json" class="hidden" onchange="importData(event)">
<div class="menu-item" onclick="showInstallGuide()"><span class="menu-icon">📱</span><span class="menu-text">添加到手机桌面</span><span class="menu-arrow">›</span></div>
<div class="menu-item" onclick="resetData()"><span class="menu-icon">🗑️</span><span class="menu-text">重置数据</span><span class="menu-arrow">›</span></div>
<div class="menu-item" onclick="toast('版本 v1.0 · 2026-08-01')"><span class="menu-icon">ℹ️</span><span class="menu-text">关于</span><span class="menu-arrow">›</span></div>
</div>

<!-- Tab Bar -->
<div class="tabbar">
<div class="tab active" onclick="switchTab('today')"><span class="tab-ic">🏠</span>今日</div>
<div class="tab" onclick="switchTab('speaking')"><span class="tab-ic">🎤</span>口语</div>
<div class="tab" onclick="switchTab('vocab')"><span class="tab-ic">📚</span>词汇</div>
<div class="tab" onclick="switchTab('stats')"><span class="tab-ic">📊</span>统计</div>
<div class="tab" onclick="switchTab('my')"><span class="tab-ic">👤</span>我的</div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
<div class="modal" id="modalContent">
<span class="modal-close" onclick="closeModal()">✕</span>
<div id="modalBody"></div>
</div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ============ COURSE DATA ============
const SPEAKING_WEEKS = [
 {n:'第1周',t:'生存英语·问候与自我介绍',p:1},
 {n:'第2周',t:'数字·时间与日期',p:1},
 {n:'第3周',t:'日常交流基础',p:1},
 {n:'第4周',t:'职场入门',p:1},
 {n:'第5周',t:'办公沟通',p:2},
 {n:'第6周',t:'会议英语',p:2},
 {n:'第7周',t:'演讲与展示',p:2},
 {n:'第8周',t:'商务社交',p:2},
 {n:'第9周',t:'商务讨论与谈判',p:3},
 {n:'第10周',t:'临床研究英语',p:3},
 {n:'第11周',t:'系统验证英语',p:3},
 {n:'第12周',t:'综合商务场景',p:3}
];
const SPEAKING_LESSONS = [
 // Week 1
 {id:'S01',w:0,t:'Hello & Goodbye',d:'基础问候语',ph:[{en:'Hello!',cn:'你好！'},{en:'Hi!',cn:'嗨！'},{en:'Good morning.',cn:'早上好。'},{en:'Good afternoon.',cn:'下午好。'},{en:'Goodbye!',cn:'再见！'},{en:'See you later.',cn:'回头见。'}],vid:'英语口语 hello goodbye 基础问候'},
 {id:'S02',w:0,t:'Nice to meet you',d:'自我介绍',ph:[{en:'My name is Li Ming.',cn:'我叫李明。'},{en:'Nice to meet you.',cn:'很高兴认识你。'},{en:'Nice to meet you, too.',cn:'我也很高兴认识你。'},{en:'How do you do?',cn:'你好（正式）'},{en:'Let me introduce myself.',cn:'让我自我介绍一下。'}],vid:'英语自我介绍 nice to meet you'},
 {id:'S03',w:0,t:'How are you?',d:'寒暄问候',ph:[{en:'How are you?',cn:'你好吗？'},{en:'I am fine, thank you.',cn:'我很好，谢谢。'},{en:'Not bad.',cn:'还不错。'},{en:'How about you?',cn:'你呢？'},{en:'I am doing great.',cn:'我挺好的。'}],vid:'英语口语 how are you 寒暄'},
 {id:'S04',w:0,t:'Where are you from?',d:'国籍与家乡',ph:[{en:'Where are you from?',cn:'你来自哪里？'},{en:'I am from Shanghai.',cn:'我来自上海。'},{en:'I am Chinese.',cn:'我是中国人。'},{en:'Where do you live?',cn:'你住在哪里？'},{en:'I live in Shanghai.',cn:'我住在上海。'}],vid:'英语口语 where are you from 国籍'},
 {id:'S05',w:0,t:'本周复习·情景对话',d:'综合练习',ph:[{en:'Hello, my name is Li Ming.',cn:'你好，我叫李明。'},{en:'Nice to meet you. Where are you from?',cn:'很高兴认识你。你来自哪里？'},{en:'I am from Shanghai. How are you?',cn:'我来自上海。你好吗？'},{en:'I am great, thank you!',cn:'我挺好的，谢谢！'}],vid:'英语口语入门 情景对话 复习'},
 // Week 2
 {id:'S06',w:1,t:'Numbers 1-100',d:'数字表达',ph:[{en:'one, two, three',cn:'一、二、三'},{en:'ten, twenty, thirty',cn:'十、二十、三十'},{en:'one hundred',cn:'一百'},{en:'first, second, third',cn:'第一、第二、第三'},{en:'How many?',cn:'多少个？'}],vid:'英语数字 1到100 发音教学'},
 {id:'S07',w:1,t:'What time is it?',d:'时间表达',ph:[{en:'What time is it?',cn:'现在几点？'},{en:'It is nine o\'clock.',cn:'九点钟。'},{en:'It is half past ten.',cn:'十点半。'},{en:'It is a quarter past three.',cn:'三点十五分。'},{en:'What time shall we meet?',cn:'我们几点见面？'}],vid:'英语时间表达 what time is it'},
 {id:'S08',w:1,t:'Days & Months',d:'日期表达',ph:[{en:'Monday, Tuesday, Wednesday',cn:'周一、周二、周三'},{en:'January, February, March',cn:'一月、二月、三月'},{en:'today, tomorrow, yesterday',cn:'今天、明天、昨天'},{en:'next week',cn:'下周'},{en:'What day is today?',cn:'今天星期几？'}],vid:'英语星期月份 days months 教学版权'},
 {id:'S09',w:1,t:'Asking about Dates',d:'询问日期',ph:[{en:'What is the date today?',cn:'今天几号？'},{en:'Today is August 1st.',cn:'今天八月一日。'},{en:'When is the meeting?',cn:'会议什么时候？'},{en:'The meeting is on Friday.',cn:'会议在周五。'},{en:'How long does it take?',cn:'需要多长时间？'}],vid:'英语日期表达 asking about dates'},
 {id:'S10',w:1,t:'本周复习·数字与时间',d:'综合练习',ph:[{en:'What time is it? It is ten o\'clock.',cn:'现在几点？十点钟。'},{en:'What day is today? Today is Monday.',cn:'今天星期几？今天周一。'},{en:'The meeting is on Friday at 2 PM.',cn:'会议在周五下午两点。'}],vid:'英语数字时间 复习 情景对话'},

// ============ STATE ============
let state = {
 speakingDone:{},
 vocabDone:{},
 vocabKnown:{},
 checkins:{},
 streak:0,
 lastCheckin:null,
 totalMinutes:0,
 currentSpeakingWeek:0,
 currentVocabWeek:0,
 flashcardIndex:0,
 timerSeconds:0,
 timerRunning:false,
 timerType:null,
 timerInterval:null,
 currentLessonId:null
};

function loadState(){
 try{const s=localStorage.getItem('be-study-state');if(s){state=Object.assign(state,JSON.parse(s))}}catch(e){}
}
function saveState(){
 try{localStorage.setItem('be-study-state',JSON.stringify(state))}catch(e){}
}
function getToday(){return new Date().toISOString().slice(0,10)}
function getDayNum(){const d=new Date();return d.getDay()===0?7:d.getDay()}

// ============ TAB SWITCHING ============
function switchTab(name){
 document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
 document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
 document.getElementById('page-'+name).classList.add('active');
 document.querySelector('.tab[onclick*="'+name+'"]').classList.add('active');
 if(name==='today')renderToday();
 if(name==='speaking')renderSpeaking();
 if(name==='vocab')renderVocab();
 if(name==='stats')renderStats();
 if(name==='my')renderMy();
 window.scrollTo(0,0);
}

// ============ TOAST ============
function toast(msg){
 const t=document.getElementById('toast');
 t.textContent=msg;t.classList.add('show');
 setTimeout(()=>t.classList.remove('show'),2000);
}

// ============ TTS ============
function speak(text,rate){
 if(!window.speechSynthesis){toast('浏览器不支持语音');return}
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text);
 u.lang='en-US';
 u.rate=rate||0.8;
 speechSynthesis.speak(u);
}

// ============ TIMER ============
function startTimer(type,minutes,lessonId){
 state.timerType=type;
 state.currentLessonId=lessonId;
 state.timerSeconds=minutes*60;
 state.timerRunning=true;
 saveState();
 showTimerModal();
}
function showTimerModal(){
 const m=state.timerSeconds;
 const mm=String(Math.floor(m/60)).padStart(2,'0');
 const ss=String(m%60).padStart(2,'0');
 const typeLabel=state.timerType==='speaking'?'🎤 口语练习':'📚 词汇学习';
 const lesson=state.timerType==='speaking'?SPEAKING_LESSONS.find(l=>l.id===state.currentLessonId):VOCAB_LESSONS.find(l=>l.id===state.currentLessonId);
 const lessonTitle=lesson?lesson.t:'';
 document.getElementById('modalBody').innerHTML=`
  <div class="modal-title">${typeLabel}</div>
  <p class="muted" style="text-align:center;margin-bottom:16px">${lessonTitle}</p>
  <div class="timer-card">
   <div class="timer-label">剩余时间</div>
   <div class="timer-display" id="timerDisplay">${mm}:${ss}</div>
   <div class="timer-btns">
    <button class="timer-btn ${state.timerRunning?'':'active'}" onclick="toggleTimer()">${state.timerRunning?'⏸ 暂停':'▶ 继续'}</button>
    <button class="timer-btn" onclick="skipTimer()">⏭ 完成</button>
    <button class="timer-btn" onclick="stopTimer()">✖ 取消</button>
   </div>
  </div>
  <div id="timerPhrases" style="margin-top:16px"></div>`;
 document.getElementById('modalOverlay').classList.add('show');
 if(state.timerRunning&&!state.timerInterval){
  state.timerInterval=setInterval(()=>{
   if(state.timerSeconds>0){
    state.timerSeconds--;
    updateTimerDisplay();
   }else{
    finishTimer();
   }
  },1000);
 }
 // Show phrases/words for reference
 if(state.timerType==='speaking'&&lesson){
  document.getElementById('timerPhrases').innerHTML='<div class="sec-title"><span class="dot"></span>今日短语</div>'+lesson.ph.map(p=>`
   <div class="phrase-card">
    <div class="phrase-en">${p.en}</div>
    <div class="phrase-cn">${p.cn}</div>
    <div class="phrase-actions"><button class="mini-btn speak" onclick="speak('${p.en.replace(/'/g,"\\'")}')">🔊 朗读</button></div>
   </div>`).join('');
 }else if(state.timerType==='vocab'&&lesson){
  document.getElementById('timerPhrases').innerHTML='<div class="sec-title"><span class="dot" style="background:var(--acc)"></span>今日单词</div>'+lesson.words.map(w=>`
   <div class="vocab-item">
    <div class="vocab-word">${w.w}<span class="ph">${w.ph}</span></div>
    <div class="vocab-meaning">${w.m}</div>
    <div style="cursor:pointer" onclick="speak('${w.w}')">🔊</div>
   </div>`).join('');
 }
}
function updateTimerDisplay(){
 const m=state.timerSeconds;
 const mm=String(Math.floor(m/60)).padStart(2,'0');
 const ss=String(m%60).padStart(2,'0');
 const el=document.getElementById('timerDisplay');
 if(el)el.textContent=mm+':'+ss;
}
function toggleTimer(){
 state.timerRunning=!state.timerRunning;
 saveState();
 if(state.timerRunning){
  state.timerInterval=setInterval(()=>{
   if(state.timerSeconds>0){state.timerSeconds--;updateTimerDisplay()}else{finishTimer()}
  },1000);
 }else{
  clearInterval(state.timerInterval);state.timerInterval=null;
 }
 showTimerModal();
}
function stopTimer(){
 clearInterval(state.timerInterval);state.timerInterval=null;
 state.timerRunning=false;
 state.timerSeconds=0;
 saveState();
 closeModal();
}
function finishTimer(){
 clearInterval(state.timerInterval);state.timerInterval=null;
 state.timerRunning=false;
 const minutes=state.timerType==='speaking'?20:15;
 state.totalMinutes+=minutes;
 // Mark lesson done
 if(state.timerType==='speaking'){
  state.speakingDone[state.currentLessonId]=true;
 }else{
  state.vocabDone[state.currentLessonId]=true;
 }
 state.timerSeconds=0;
 saveState();
 closeModal();
 confetti();
 toast(state.timerType==='speaking'?'🎤 口语练习完成！+20分钟':'📚 词汇学习完成！+15分钟');
 setTimeout(()=>{switchTab('today')},500);
}

// ============ CHECKIN ============
function checkin(){
 const today=getToday();
 state.checkins[today]={date:today,speaking:true,vocab:true};
 // Update streak
 if(state.lastCheckin){
  const last=new Date(state.lastCheckin);
  const today2=new Date(today);
  const diff=Math.round((today2-last)/(1000*60*60*24));
  if(diff===1)state.streak++;
  else if(diff>1)state.streak=1;
 }else{
  state.streak=1;
 }
 state.lastCheckin=today;
 saveState();
 confetti();
 toast('🎉 打卡成功！连续'+state.streak+'天！');
 setTimeout(()=>renderToday(),500);
}

function renderSpeaking(){
 const wt=document.getElementById('speakingWeekTabs');
 const unlockedWeek=Math.floor(Object.keys(state.speakingDone).filter(k=>state.speakingDone[k]).length/5);
 wt.innerHTML=SPEAKING_WEEKS.map((w,i)=>{
  const locked=i>unlockedWeek;
  return '<div class="week-tab '+ (i===state.currentSpeakingWeek?'active':'')+' '+ (locked?'locked':'')+'" onclick="'+ (locked?'toast(\'先完成前面的课程解锁\')':'selectSpeakingWeek('+i+')')+'">'+w.n+'</div>';
 }).join('');
 renderSpeakingLessons();
}
function selectSpeakingWeek(idx){state.currentSpeakingWeek=idx;renderSpeaking()}
function renderSpeakingLessons(){
 const weekLessons=SPEAKING_LESSONS.filter(l=>l.w===state.currentSpeakingWeek);
 const w=SPEAKING_WEEKS[state.currentSpeakingWeek];
 const phaseClass='phase-'+w.p;
 const doneCount=weekLessons.filter(l=>state.speakingDone[l.id]).length;
 document.getElementById('speakingLessons').innerHTML=`
  <div class="card">
   <span class="phase-tag ${phaseClass}">阶段${w.p}</span>
   <h2 style="font-size:16px">${w.n}：${w.t}</h2>
   <p class="muted">本周进度：${doneCount}/${weekLessons.length}课</p>
   <div class="pbar" style="margin-top:8px"><div class="pbar-fill" style="width:${doneCount/weekLessons.length*100}%"></div></div>
  </div>
  ${weekLessons.map((l,i)=>{
   const done=state.speakingDone[l.id];
   const allPrevDone=i===0||state.speakingDone[weekLessons[i-1].id];
   const prevWeekDone=state.currentSpeakingWeek===0||Object.keys(state.speakingDone).filter(k=>state.speakingDone[k]).length>=state.currentSpeakingWeek*5;
   const locked=!prevWeekDone&&!allPrevDone;
   return '<div class="lesson-item '+ (done?'done':'')+' '+ (locked?'locked':'')+'" onclick="'+ (locked?'toast(\'先完成前面的课程\')':'openSpeakingLesson(\''+l.id+'\')')+'"><div class="lesson-num">'+(state.currentSpeakingWeek*5+i+1)+'</div><div class="lesson-info"><div class="t">'+l.t+'</div><div class="d">'+l.d+' · '+l.ph.length+'个短语</div></div><div class="lesson-status">'+(done?'✅':locked?'🔒':'▶️')+'</div></div>';
  }).join('')}`;
}
function openSpeakingLesson(id){
 const l=SPEAKING_LESSONS.find(x=>x.id===id);
 if(!l)return;
 const w=SPEAKING_WEEKS[l.w];
 const done=state.speakingDone[id];
 const vidUrl='https://search.bilibili.com/all?keyword='+encodeURIComponent(l.vid);
 document.getElementById('modalBody').innerHTML=`
  <div class="modal-title">🎤 ${l.t}</div>
  <p class="muted" style="text-align:center;margin-bottom:8px">${w.n} · ${l.d}</p>
  <span class="phase-tag phase-${w.p}" style="display:block;text-align:center;margin-bottom:16px">阶段${w.p}</span>
  <div class="sec-title"><span class="dot"></span>核心短语</div>
  ${l.ph.map(p=>`
   <div class="phrase-card">
    <div class="phrase-en">${p.en}</div>
    <div class="phrase-cn">${p.cn}</div>
    <div class="phrase-actions">
     <button class="mini-btn speak" onclick="speak('${p.en.replace(/'/g,"\\'")}',0.8)">🔊 常速</button>
     <button class="mini-btn speak" onclick="speak('${p.en.replace(/'/g,"\\'")}',0.5)">🐢 慢速</button>
    </div>
   </div>`).join('')}
  <div style="margin:16px 0">
   <a href="${vidUrl}" target="_blank" style="text-decoration:none"><button class="btn btn-amber">📺 观看视频讲解</button></a>
  </div>
  <button class="btn ${done?'btn-outline':'btn-primary'}" onclick="toggleSpeakingDone('${id}')">${done?'↩ 取消完成':'✅ 标记完成'}</button>
  <button class="btn btn-outline" onclick="startTimer('speaking',20,'${id}')" style="margin-top:8px">⏱️ 开始20分钟练习</button>`;
 document.getElementById('modalOverlay').classList.add('show');
}
function toggleSpeakingDone(id){
 state.speakingDone[id]=!state.speakingDone[id];
 saveState();
 toast(state.speakingDone[id]?'✅ 已标记完成':'已取消完成');
 closeModal();
 renderSpeaking();
}

// ============ VOCAB PAGE ============
function renderVocab(){
 const wt=document.getElementById('vocabWeekTabs');
 const unlockedWeek=Math.floor(Object.keys(state.vocabDone).filter(k=>state.vocabDone[k]).length/5);
 wt.innerHTML=VOCAB_WEEKS.map((w,i)=>{
  const locked=i>unlockedWeek;
  return '<div class="week-tab '+ (i===state.currentVocabWeek?'active':'')+' '+ (locked?'locked':'')+'" onclick="'+ (locked?'toast(\'先完成前面的课程解锁\')':'selectVocabWeek('+i+')')+'">'+w.n+'</div>';
 }).join('');
 renderVocabLessons();
}
function selectVocabWeek(idx){state.currentVocabWeek=idx;renderVocab()}
function renderVocabLessons(){
 const weekLessons=VOCAB_LESSONS.filter(l=>l.w===state.currentVocabWeek);
 const w=VOCAB_WEEKS[state.currentVocabWeek];
 const phaseClass='phase-'+w.p;
 const doneCount=weekLessons.filter(l=>state.vocabDone[l.id]).length;
 document.getElementById('vocabLessons').innerHTML=`
  <div class="card">
   <span class="phase-tag ${phaseClass}">阶段${w.p}</span>
   <h2 style="font-size:16px">${w.n}：${w.t}</h2>
   <p class="muted">本周进度：${doneCount}/${weekLessons.length}课</p>
   <div class="pbar" style="margin-top:8px"><div class="pbar-fill" style="width:${doneCount/weekLessons.length*100}%;background:linear-gradient(90deg,var(--acc),var(--acc-d))"></div></div>
  </div>
  ${weekLessons.map((l,i)=>{
   const done=state.vocabDone[l.id];
   const knownCount=l.words.filter(wd=>state.vocabKnown[wd.w]).length;
   const allPrevDone=i===0||state.vocabDone[weekLessons[i-1].id];
   const prevWeekDone=state.currentVocabWeek===0||Object.keys(state.vocabDone).filter(k=>state.vocabDone[k]).length>=state.currentVocabWeek*5;
   const locked=!prevWeekDone&&!allPrevDone;
   return '<div class="lesson-item '+ (done?'done':'')+' '+ (locked?'locked':'')+'" onclick="'+ (locked?'toast(\'先完成前面的课程\')':'openVocabLesson(\''+l.id+'\')')+'"><div class="lesson-num" style="background:var(--acc-l);color:var(--acc-d)">'+(state.currentVocabWeek*5+i+1)+'</div><div class="lesson-info"><div class="t">'+l.t+'</div><div class="d">'+l.d+' · 已掌握'+knownCount+'/'+l.words.length+'</div></div><div class="lesson-status">'+(done?'✅':locked?'🔒':'▶️')+'</div></div>';
  }).join('')}`;
}
function openVocabLesson(id){
 const l=VOCAB_LESSONS.find(x=>x.id===id);
 if(!l)return;
 const w=VOCAB_WEEKS[l.w];
 const done=state.vocabDone[id];
 state.flashcardIndex=0;
 renderVocabModal(l,w,done);
}
function renderVocabModal(l,w,done){
 const idx=state.flashcardIndex;
 const word=l.words[idx];
 const isKnown=state.vocabKnown[word.w];
 const vidUrl='https://search.bilibili.com/all?keyword='+encodeURIComponent('英语词汇 '+word.w+' 发音教学');
 document.getElementById('modalBody').innerHTML=`
  <div class="modal-title">📚 ${l.t}</div>
  <p class="muted" style="text-align:center;margin-bottom:8px">${w.n} · ${idx+1}/${l.words.length}</p>
  <div class="flashcard-container">
   <div class="flashcard" id="flashcard" onclick="flipCard()">
    <div class="flashcard-face flashcard-front">
     <div class="flashcard-word">${word.w}</div>
     <div class="flashcard-phonetic">${word.ph}</div>
     <div class="flashcard-hint">点击翻面</div>
    </div>
    <div class="flashcard-face flashcard-back">
     <div class="flashcard-meaning">${word.m}</div>
     <div class="flashcard-example">${word.ex}</div>
     <div class="flashcard-hint">点击翻面</div>
    </div>
   </div>
  </div>
  <div style="display:flex;gap:8px;margin-bottom:16px">
   <button class="mini-btn speak" onclick="event.stopPropagation();speak('${word.w}',0.8)" style="flex:1;padding:10px">🔊 朗读</button>
   <button class="mini-btn speak" onclick="event.stopPropagation();speak('${word.w}',0.5)" style="flex:1;padding:10px">🐢 慢速</button>
  </div>
  <div style="display:flex;gap:8px;margin-bottom:16px">
   <button class="btn btn-outline" onclick="prevCard(${l.words.length})" style="flex:1">⬅ 上一个</button>
   <button class="btn btn-primary" onclick="nextCard(${l.words.length})" style="flex:1">下一个 ➡</button>
  </div>
  <div style="display:flex;gap:8px;margin-bottom:16px">
   <button class="btn ${isKnown?'btn-grn':'btn-outline'}" onclick="toggleKnown('${word.w}')" style="flex:1">${isKnown?'✅ 已掌握':'标记掌握'}</button>
  </div>
  <a href="${vidUrl}" target="_blank" style="text-decoration:none"><button class="btn btn-amber" style="width:100%;margin-bottom:8px">📺 观看词汇视频</button></a>
  <button class="btn ${done?'btn-outline':'btn-primary'}" onclick="toggleVocabDone('${l.id}')">${done?'↩ 取消完成':'✅ 标记本课完成'}</button>
  <button class="btn btn-outline" onclick="startTimer('vocab',15,'${l.id}')" style="margin-top:8px">⏱️ 开始15分钟学习</button>`;
 document.getElementById('modalOverlay').classList.add('show');
}
function flipCard(){
 const c=document.getElementById('flashcard');
 if(c)c.classList.toggle('flipped');
}
function nextCard(total){
 state.flashcardIndex=(state.flashcardIndex+1)%total;
 saveState();
 const l=VOCAB_LESSONS.find(x=>x.id===state.currentLessonId)||VOCAB_LESSONS.filter(x=>x.w===state.currentVocabWeek)[0];
 // Find current lesson from modal
 const modalTitle=document.querySelector('.modal-title');
 if(modalTitle){
  const titleText=modalTitle.textContent.replace('📚 ','');
  const lesson=VOCAB_LESSONS.find(x=>x.t===titleText);
  if(lesson){
   const w=VOCAB_WEEKS[lesson.w];
   const done=state.vocabDone[lesson.id];
   renderVocabModal(lesson,w,done);
   return;
  }
 }
}
function prevCard(total){
 state.flashcardIndex=(state.flashcardIndex-1+total)%total;
 saveState();
 const modalTitle=document.querySelector('.modal-title');
 if(modalTitle){
  const titleText=modalTitle.textContent.replace('📚 ','');
  const lesson=VOCAB_LESSONS.find(x=>x.t===titleText);
  if(lesson){
   const w=VOCAB_WEEKS[lesson.w];
   const done=state.vocabDone[lesson.id];
   renderVocabModal(lesson,w,done);
   return;
  }
 }
}
function toggleKnown(word){
 state.vocabKnown[word]=!state.vocabKnown[word];
 saveState();
 toast(state.vocabKnown[word]?'✅ 已标记掌握':'已取消掌握');
 const modalTitle=document.querySelector('.modal-title');
 if(modalTitle){
  const titleText=modalTitle.textContent.replace('📚 ','');
  const lesson=VOCAB_LESSONS.find(x=>x.t===titleText);
  if(lesson){
   const w=VOCAB_WEEKS[lesson.w];
   const done=state.vocabDone[lesson.id];
   renderVocabModal(lesson,w,done);
   return;
  }
 }
}
function toggleVocabDone(id){
 state.vocabDone[id]=!state.vocabDone[id];
 saveState();
 toast(state.vocabDone[id]?'✅ 已标记完成':'已取消完成');
 closeModal();
 renderVocab();
}

let chart7,chartP,chartT;
function renderStats(){
 const days=Object.keys(state.checkins).length;
 const speakLessons=Object.keys(state.speakingDone).filter(k=>state.speakingDone[k]).length;
 const vocabLessons=Object.keys(state.vocabDone).filter(k=>state.vocabDone[k]).length;

 const minutes=state.totalMinutes;
 document.getElementById('statDays').textContent=days;
 document.getElementById('statLessons').textContent=speakLessons+vocabLessons;
 document.getElementById('statWords').textContent=words;
 document.getElementById('statMinutes').textContent=minutes;
 
 // 7-day chart
 const labels=[];const data=[];
 for(let i=6;i>=0;i--){
  const d=new Date();d.setDate(d.getDate()-i);
  const ds=d.toISOString().slice(0,10);
  labels.push(d.toLocaleDateString('zh-CN',{month:'numeric',day:'numeric'}));

 }
 if(chart7)chart7.destroy();
 chart7=new Chart(document.getElementById('chart7days'),{

  data:{labels:labels,datasets:[{label:'打卡',data:data,backgroundColor:data.map(v=>v?'#0F766E':'#E2E8F0'),borderRadius:6,maxBarThickness:30}]},
  options:{plugins:{legend:{display:false}},scales:{y:{display:false,beginAtZero:true,max:1.2}},aspectRatio:3}
 });
 
 // Progress chart

  type:'doughnut',
  data:{labels:['口语完成','口语剩余','词汇完成','词汇剩余'],datasets:[{data:[speakLessons,60-speakLessons,vocabLessons,60-vocabLessons],backgroundColor:['#0F766E','#E2E8F0','#F59E0B','#FEF3C7'],borderWidth:0}]},
  options:{plugins:{legend:{position:'bottom',labels:{padding:12,font:{size:11}}}}}
 });
 
 // Type chart
 if(chartT)chartT.destroy();
 const speakMin=Object.keys(state.speakingDone).filter(k=>state.speakingDone[k]).length*20;
 const vocabMin=Object.keys(state.vocabDone).filter(k=>state.vocabDone[k]).length*15;
 chartT=new Chart(document.getElementById('chartType'),{
  type:'doughnut',
  data:{labels:['口语时长','词汇时长'],datasets:[{data:[speakMin,vocabMin],backgroundColor:['#0F766E','#F59E0B'],borderWidth:0}]},
  options:{plugins:{legend:{position:'bottom',labels:{padding:12,font:{size:11}}}}}
 });
}

// ============ MODAL ============
function closeModal(){
 document.getElementById('modalOverlay').classList.remove('show');
 if(state.timerInterval){clearInterval(state.timerInterval);state.timerInterval=null}
}

// ============ DATA EXPORT/IMPORT ============
function exportData(){
 const data=JSON.stringify(state);
 const blob=new Blob([data],{type:'application/json'});
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');
 a.href=url;a.download='english-study-'+getToday()+'.json';
 a.click();
 URL.revokeObjectURL(url);
 toast('📥 数据已导出');
}
function importData(event){
 const file=event.target.files[0];
 if(!file)return;
 const reader=new FileReader();
 reader.onload=function(e){
  try{
   const data=JSON.parse(e.target.result);
   state=Object.assign(state,data);
   saveState();
   toast('📤 数据导入成功！');
   switchTab('today');
  }catch(err){toast('导入失败：文件格式错误')}
 };
 reader.readAsText(file);
}
function resetData(){
 if(!confirm('确定重置所有学习数据吗？此操作不可恢复！'))return;
 state={speakingDone:{},vocabDone:{},vocabKnown:{},checkins:{},streak:0,lastCheckin:null,totalMinutes:0,currentSpeakingWeek:0,currentVocabWeek:0,flashcardIndex:0,timerSeconds:0,timerRunning:false,timerType:null,timerInterval:null,currentLessonId:null};
 saveState();
 toast('已重置所有数据');
 switchTab('today');
}

// ============ CONFETTI ============
function confetti(){
 const colors=['#0F766E','#F59E0B','#22C55E','#6366F1','#EF4444','#EC4899'];
 for(let i=0;i<40;i++){
  const c=document.createElement('div');
  c.className='confetti';
  c.style.left=Math.random()*100+'%';
  c.style.top='-10px';
  c.style.background=colors[Math.floor(Math.random()*colors.length)];
  c.style.borderRadius=Math.random()>0.5?'50%':'0';
  c.style.animationDelay=Math.random()*0.5+'s';
  c.style.animationDuration=(2+Math.random()*2)+'s';
  document.body.appendChild(c);
  setTimeout(()=>c.remove(),4000);
 }
}
